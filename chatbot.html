<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AstroBot Chat</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
<style>/* === GLOBAL & BODY === */
body {
  background-image: url('assets/images/chatbot-bg.png');
  background-size: cover;
  background-position: right center; /* shifted background */
  background-repeat: no-repeat;
  background-attachment: fixed;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: white;
  overflow-x: hidden;
}

/* === HEADER === */
header {
  background-color: rgba(21, 21, 56, 0.9);
  padding: 20px;
  border-bottom: 2px solid #00bfff;
  backdrop-filter: blur(5px);
  text-shadow: 0 0 10px #00ffcc;
  animation: slideInDown 1s ease;
}

/* === MAIN CHAT CONTAINER === */
main {
  padding: 30px 20px;
  display: flex;
  justify-content: center;
  animation: fadeIn 1s ease-in;
}

.chat-container {
  max-width: 800px;
  width: 100%;
  background-color: rgba(26, 26, 61, 0.95);
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0, 191, 255, 0.7);
  backdrop-filter: blur(4px);
  animation: slideInUp 0.8s ease;
}

/* === CHAT WINDOW === */
#chat-window {
  height: 400px;
  overflow-y: auto;
  background: rgba(11, 11, 76, 0.9);
  border: 1px solid #00bfff;
  padding: 15px;
  font-size: 0.95rem;
  border-radius: 10px;
  text-align: left;
  box-shadow: inset 0 0 10px #00bfff44;
  scroll-behavior: smooth;
}

/* === MESSAGES === */
.message {
  margin-bottom: 14px;
  animation: fadeIn 0.4s ease-in-out;
}

.message strong {
  color: #00ffcc;
}

.message p {
  margin: 4px 0 0;
}

/* === INPUT ROW === */
.input-row {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  align-items: center;
}

.input-row input {
  flex: 1;
  padding: 12px;
  font-size: 16px;
  border-radius: 10px;
  border: 2px solid #00bfff;
  background-color: #1a1a3d;
  color: white;
  transition: 0.3s;
}

.input-row input:focus {
  outline: none;
  border-color: #00ffcc;
  box-shadow: 0 0 8px #00ffcc;
}

.input-row button {
  padding: 12px 16px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  transition: 0.3s;
  font-weight: bold;
}

/* === BUTTON STYLES === */
#micBtn {
  background-color: #00bfff;
  color: white;
  border: 2px solid #00e0ff;
  box-shadow: 0 0 8px #00e0ff;
}

#micBtn:hover {
  background-color: #00d1ff;
}

#send-btn {
  background-color: #00ffcc;
  color: black;
  box-shadow: 0 0 8px #00ffcc;
}

#send-btn:hover {
  background-color: #00e6b8;
}

/* === FOOTER === */
footer {
  background-color: rgba(21, 21, 56, 0.9);
  padding: 12px;
  color: #aaa;
  text-align: center;
  border-top: 1px solid #00bfff;
  backdrop-filter: blur(4px);
}

/* === ASTROBOT IMAGE FLOAT ON HOVER === */
#astrobot-img:hover {
  animation: bob 2s ease-in-out infinite;
}

/* === ANIMATIONS === */
@keyframes fadeIn {
  0% { opacity: 0; transform: scale(0.98); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes slideInUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes slideInDown {
  from { transform: translateY(-30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.3); opacity: 1; }
  100% { transform: scale(1); opacity: 0.8; }
}

@keyframes typing {
  from { width: 0; }
  to { width: 100%; }
}

@keyframes blink {
  from, to { border-color: transparent; }
  50% { border-color: #00ffff; }
}

/* === SCROLLBAR === */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-thumb {
  background: #00bfff;
  border-radius: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

/* === TYPING TEXT === */
.typewriter {
  overflow: hidden;
  white-space: nowrap;
  border-right: 2px solid #00ffff;
  width: 0;
  animation: typing 4s steps(30, end) forwards, blink 0.8s step-end infinite;
}

/* === GLOW EFFECT (Robot Eye etc) === */
.eye-glow {
  position: absolute;
  width: 20px;
  height: 20px;
  top: 40%;
  left: 75%;
  background: radial-gradient(circle, #00faff, #005566);
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}

/* === FLOATING ORBS === */
.floating-orb {
  position: absolute;
  width: 12px;
  height: 12px;
  background: rgba(0, 255, 255, 0.4);
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(0,255,255,0.4);
  animation: floatOrb 6s ease-in-out infinite alternate;
}

@keyframes floatOrb {
  0% { transform: translateY(0); }
  100% { transform: translateY(-20px); }
}
.astro-container {
  position: fixed;
  left: 30px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
}

.astronaut {
  width: 350px; /* Increased size */
  animation: levitate 4s ease-in-out infinite;
}

@keyframes levitate {
  0%   { transform: translateY(0); }
  50%  { transform: translateY(-25px); }
  100% { transform: translateY(0); }
}
#space {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1; /* Puts it behind everything */
  width: 100%;
  height: 100%;
  pointer-events: none; /* Avoid blocking clicks */
}

</style>

</head>
<body>
    <canvas id="space"></canvas>
  <header>
    <h1>🤖 AstroBot Chat</h1>
    <h2 class="typewriter">Hello, I'm AstroBot — Here to Help You!</h2>

  </header>
  
  <main>
    <div class="chat-container">
      <div id="chat-window"></div>
      <div class="input-row">
        <input type="text" id="chat-input" placeholder="Type or speak your message...">
        <button id="micBtn">🎤</button>
        <button id="send-btn">Send</button>
      </div>
    </div>
  <div class="floating-orb" style="top:20%; left:10%;"></div>
<div class="floating-orb" style="top:70%; left:80%; animation-delay: 1.5s;"></div>
<div class="floating-orb" style="top:40%; left:50%; animation-delay: 2.2s;"></div>
<div class="astro-container">
  <img src="assets/images/astro.png" alt="Levitating Astronaut" class="astronaut">
</div>

     
  </main>
  <button id="readBtn" style="
  margin-top: 15px;
  padding: 10px 20px;
  background-color: #01212b;
  color: white;
  border: 2px solid #00bfff; 
  box-shadow: 0 0 10px rgb(0, 191, 255);
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
">🔊 Read Last Message</button>


  <footer>
    <p>&copy; 2025 Space Bot | AstroBot Module</p>
  </footer>

  <script>
    const chatInput = document.getElementById("chat-input");
    const chatWindow = document.getElementById("chat-window");
    const sendBtn = document.getElementById("send-btn");
    const micBtn = document.getElementById("micBtn");

    const API_KEY = "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"; // Replace with your OpenRouter API key

    sendBtn.addEventListener("click", sendMessage);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    async function sendMessage() {
      const userMessage = chatInput.value.trim();
      if (!userMessage) return;

      appendMessage("👨‍🚀 You", userMessage);
      chatInput.value = "";

      appendMessage("🤖 AstroBot", "Typing...");

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "mistralai/mixtral-8x7b-instruct",
            messages: [
              { role: "system", content: "You are a friendly AI assistant helping astronauts troubleshoot spaceship problems and track their health." },
              { role: "user", content: userMessage }
            ]
          })
        });

        const data = await response.json();
        const botReply = data.choices[0]?.message?.content || "❌ No reply from AstroBot.";
        updateLastMessage(botReply);
       

      } catch (err) {
        updateLastMessage("⚠️ Connection error. Try again later.");
        console.error("Chatbot Error:", err);
      }
    }

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.className = "message";
      msg.innerHTML = `<strong>${sender}:</strong> <p>${text}</p>`;
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function updateLastMessage(newText) {
      const last = chatWindow.querySelector(".message:last-child p");
      if (last) last.textContent = newText;
    }


    // 🎙️ Voice Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    micBtn.addEventListener("click", () => {
      recognition.start();
      micBtn.textContent = "🎙️ Listening...";
    });

    recognition.onresult = (event) => {
      const speechResult = event.results[0][0].transcript;
      chatInput.value = speechResult;
      micBtn.textContent = "🎤";
    };

    recognition.onerror = () => micBtn.textContent = "🎤";
    recognition.onend = () => micBtn.textContent = "🎤";
    function speakText(text) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 1;
  utterance.pitch = 1.1;
  utterance.voice = speechSynthesis.getVoices().find(voice => voice.lang === "en-US");
  speechSynthesis.speak(utterance);
}

  const readBtn = document.getElementById("readBtn");

  readBtn.addEventListener("click", () => {
    const lastBotMessage = document.querySelector(".message:last-child p");
    if (lastBotMessage) {
      speakText(lastBotMessage.textContent);
    } else {
      alert("No message to read yet!");
    }
  });

  function speakText(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";
    utterance.rate = 1;
    utterance.pitch = 1.1;
    utterance.voice = speechSynthesis.getVoices().find(voice => voice.lang === "en-US");
    speechSynthesis.speak(utterance);
  }


  </script>

  <script>
const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let particles = [];
for (let i = 0; i < 150; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5,
    d: Math.random() * 150
  });
}
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';

  ctx.beginPath();
  particles.forEach(p => {
    ctx.moveTo(p.x, p.y);
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
  });
  ctx.fill();
  move();
}
function move() {
  particles.forEach(p => {
    p.y += 0.3;
    if (p.y > canvas.height) p.y = 0;
  });
}
setInterval(draw, 33);
</script>
</body>
</html>
